<!DOCTYPE html>
<html>
<head>
    <title>Download App - Under Process</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"/>
    <style>
        .under-process {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .under-process i {
            font-size: 48px;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        .under-process h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .under-process p {
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="under-process">
        <i class="fas fa-cog fa-spin"></i>
        <h1>Under Process</h1>
        <p>Our mobile app is currently under development. Please check back soon!</p>
    </div>
</body>
</html>
